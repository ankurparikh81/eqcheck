[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eqcheck"
version = "0.1.0"
description = "Semantic equivalence checker for C++ source files via LLVM IR"
readme = "README.md"
authors = [{ name = "Ankur" }]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
eqcheck = "eqcheck.cli:main"

[tool.setuptools.packages.find]
include = ["eqcheck*"]
